<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Class Attendance</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
      background: #f5f5f5;
    }

    .container {
      max-width: 550px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

    input {
      font-size: 20px;
      padding: 12px;
      width: 80%;
      max-width: 350px;
      text-align: center;
    }

    button {
      font-size: 20px;
      padding: 14px 28px;
      margin: 15px;
      cursor: pointer;
    }

    #forgetButton {
      font-size: 14px;
      padding: 8px 14px;
      margin-top: 5px;
      display: none;
    }

    #scanAgainButton {
      display: none;
    }

    #savedMessage {
      font-size: 14px;
      color: #666;
      margin-top: 8px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #scannerSection {
      display: none;
    }

    #result {
      font-size: 24px;
      font-weight: bold;
      margin-top: 25px;
      white-space: pre-line;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>Class Attendance</h1>


  <div id="usernameSection">

    <h2>Enter Your Username</h2>

    <input
      type="text"
      id="username"
      placeholder="NEIU username"
      autocapitalize="none"
      autocomplete="username"
    >

    <div id="savedMessage"></div>

    <br>

    <button id="continueButton">
      Continue to Scanner
    </button>

    <br>

    <button
      id="forgetButton"
      onclick="forgetUsername()"
    >
      Forget Saved Username
    </button>

  </div>


  <div id="scannerSection">

    <h2>Scan Today's QR Code</h2>

    <div id="reader"></div>

    <div id="result">
      Waiting for QR code...
    </div>

    <button
      id="scanAgainButton"
      onclick="scanAgain()"
    >
      Scan Another Code
    </button>

  </div>

</div>


<script>

  var SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbyE-JYOlFuMXLNZj0lRHlS9aEr7ViP7bcItYZKB9XY-mb90iWg8yqKmePtDhUuu6H1u/exec";


  var currentUsername =
    "";


  var submissionLocked =
    false;


  var qrScanner =
    null;


  var scannerGeneration =
    0;


  var scannerCleanupPromise =
    Promise.resolve();



  // ==================================================
  // DEVICE ID
  // ==================================================

  function getDeviceId() {

    var deviceId =
      localStorage.getItem(
        "attendanceDeviceId"
      );


    if (!deviceId) {

      deviceId =
        "device-" +
        new Date().getTime() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2, 12);


      localStorage.setItem(
        "attendanceDeviceId",
        deviceId
      );
    }


    return deviceId;
  }



  // ==================================================
  // SAVED USERNAME
  // ==================================================

  function loadSavedUsername() {

    var savedUsername =
      localStorage.getItem(
        "attendanceUsername"
      );


    if (savedUsername) {

      document
        .getElementById("username")
        .value =
        savedUsername;


      document
        .getElementById("savedMessage")
        .innerText =
        "Saved username: " +
        savedUsername;


      document
        .getElementById("forgetButton")
        .style.display =
        "inline-block";
    }
  }



  function saveUsername(username) {

    localStorage.setItem(
      "attendanceUsername",
      username
    );
  }



  function forgetUsername() {

    localStorage.removeItem(
      "attendanceUsername"
    );


    document
      .getElementById("username")
      .value =
      "";


    document
      .getElementById("savedMessage")
      .innerText =
      "";


    document
      .getElementById("forgetButton")
      .style.display =
      "none";
  }



  // ==================================================
  // CONTINUE
  // ==================================================

  document
    .getElementById("continueButton")
    .onclick =
    function() {

      var username =
        document
          .getElementById("username")
          .value
          .trim()
          .toLowerCase();


      if (
        username === ""
      ) {

        alert(
          "Please enter your username."
        );

        return;
      }


      currentUsername =
        username;


      saveUsername(
        username
      );


      document
        .getElementById("usernameSection")
        .style.display =
        "none";


      document
        .getElementById("scannerSection")
        .style.display =
        "block";


      startScanner();
    };



  // ==================================================
  // START SCANNER
  // ==================================================

  function startScanner() {

    submissionLocked =
      false;


    document
      .getElementById("scanAgainButton")
      .style.display =
      "none";


    document
      .getElementById("result")
      .innerText =
      "Starting scanner...";


    scannerGeneration++;


    var thisGeneration =
      scannerGeneration;


    scannerCleanupPromise
      .then(function() {


        if (
          thisGeneration !==
          scannerGeneration
        ) {

          return;
        }


        document
          .getElementById("result")
          .innerText =
          "Waiting for QR code...";


        qrScanner =
          new Html5QrcodeScanner(

            "reader",

            {

              fps: 10,

              qrbox: {

                width: 250,

                height: 250

              },

              rememberLastUsedCamera:
                true

            },

            false
          );



        function onScanSuccess(
          decodedText
        ) {


          if (
            thisGeneration !==
            scannerGeneration
          ) {

            return;
          }


          if (
            submissionLocked
          ) {

            return;
          }


          submissionLocked =
            true;


          document
            .getElementById("result")
            .innerText =
            "QR code read.\nSubmitting attendance...";


          stopScanner()
            .then(function() {

              sendAttendance(
                currentUsername,
                decodedText
              );

            });

        }



        function onScanFailure(
          error
        ) {

          // Normal failed reads are ignored.

        }



        qrScanner.render(
          onScanSuccess,
          onScanFailure
        );

      });

  }



  // ==================================================
  // STOP SCANNER
  // ==================================================

  function stopScanner() {

    if (!qrScanner) {

      return scannerCleanupPromise;
    }


    var scannerToStop =
      qrScanner;


    qrScanner =
      null;


    scannerCleanupPromise =
      scannerToStop
        .clear()
        .catch(function(error) {

          console.log(
            "Scanner cleanup:",
            error
          );

        });


    return scannerCleanupPromise;
  }



  // ==================================================
  // SCAN AGAIN
  // ==================================================

  function scanAgain() {

    document
      .getElementById("scanAgainButton")
      .style.display =
      "none";


    document
      .getElementById("result")
      .innerText =
      "Restarting scanner...";


    startScanner();
  }



  function showScanAgainButton() {

    document
      .getElementById("scanAgainButton")
      .style.display =
      "inline-block";
  }



  // ==================================================
  // SEND ATTENDANCE
  // ==================================================

  function sendAttendance(
    username,
    sessionId
  ) {

    var callbackName =
      "attendanceCallback" +
      new Date().getTime();


    var requestScript =
      document.createElement(
        "script"
      );


    var requestFinished =
      false;



    /*
      30-second confirmation timeout.

      If confirmation is lost, rescanning is safe
      because the backend is now idempotent.
    */

    var timeoutId =
      setTimeout(
        function() {

          if (
            requestFinished
          ) {

            return;
          }


          requestFinished =
            true;


          document
            .getElementById("result")
            .innerText =
            "Unable to confirm attendance.\n\n" +
            "Your attendance may already have been recorded.\n\n" +
            "Tap Scan Another Code and scan the same code again.";


          showScanAgainButton();


          cleanupRequest();

        },

        30000
      );



    window[callbackName] =
      function(result) {


        if (
          requestFinished
        ) {

          return;
        }


        requestFinished =
          true;


        clearTimeout(
          timeoutId
        );



        // ======================================
        // ALREADY RECORDED
        // ======================================

        if (
          result.success &&
          result.alreadyRecorded
        ) {


          if (
            result.action ===
            "IN"
          ) {

            document
              .getElementById("result")
              .innerText =
              "✓ Check IN already recorded\n\n" +
              result.firstName +
              " " +
              result.lastName +
              "\n" +
              result.section;

          }


          else if (
            result.action ===
            "OUT"
          ) {

            document
              .getElementById("result")
              .innerText =
              "✓ Check OUT already recorded\n\n" +
              result.firstName +
              " " +
              result.lastName +
              "\n" +
              result.section;

          }


          else {

            document
              .getElementById("result")
              .innerText =
              "✓ Attendance already recorded";

          }

        }



        // ======================================
        // NEW SUCCESS
        // ======================================

        else if (
          result.success
        ) {


          if (
            result.action ===
            "IN"
          ) {

            document
              .getElementById("result")
              .innerText =
              "✓ Checked IN\n\n" +
              result.firstName +
              " " +
              result.lastName +
              "\n" +
              result.section;

          }


          else if (
            result.action ===
            "OUT"
          ) {

            document
              .getElementById("result")
              .innerText =
              "✓ Checked OUT\n\n" +
              result.firstName +
              " " +
              result.lastName +
              "\n" +
              result.section;

          }


          else {

            document
              .getElementById("result")
              .innerText =
              "✓ Attendance Recorded\n\n" +
              result.firstName +
              " " +
              result.lastName +
              "\n" +
              result.section;

          }

        }



        // ======================================
        // REJECTED / FLAGGED
        // ======================================

        else {

          document
            .getElementById("result")
            .innerText =
            "Attendance not recorded\n\n" +
            result.status;

        }



        showScanAgainButton();



        setTimeout(
          cleanupRequest,
          1000
        );

      };



    requestScript.onerror =
      function() {


        if (
          requestFinished
        ) {

          return;
        }


        requestFinished =
          true;


        clearTimeout(
          timeoutId
        );


        document
          .getElementById("result")
          .innerText =
          "Unable to confirm attendance.\n\n" +
          "Your attendance may already have been recorded.\n\n" +
          "Tap Scan Another Code and scan the same code again.";


        showScanAgainButton();


        cleanupRequest();

      };



    function cleanupRequest() {

      if (
        requestScript.parentNode
      ) {

        requestScript.parentNode
          .removeChild(
            requestScript
          );
      }


      try {

        delete window[
          callbackName
        ];

      } catch (error) {

        window[
          callbackName
        ] =
        undefined;
      }

    }



    requestScript.src =
      SCRIPT_URL +

      "?username=" +
      encodeURIComponent(
        username
      ) +

      "&sessionId=" +
      encodeURIComponent(
        sessionId
      ) +

      "&deviceId=" +
      encodeURIComponent(
        getDeviceId()
      ) +

      "&userAgent=" +
      encodeURIComponent(
        navigator.userAgent
      ) +

      "&callback=" +
      encodeURIComponent(
        callbackName
      );


    document.body
      .appendChild(
        requestScript
      );

  }



  // ==================================================
  // STARTUP
  // ==================================================

  loadSavedUsername();

</script>


</body>

</html>
