<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Attendance QR Test</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
      background: #f5f5f5;
    }

    .container {
      max-width: 550px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

    input {
      font-size: 20px;
      padding: 12px;
      width: 80%;
      max-width: 350px;
      text-align: center;
    }

    button {
      font-size: 20px;
      padding: 14px 28px;
      margin: 15px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #scannerSection {
      display: none;
    }

    #result {
      font-size: 24px;
      font-weight: bold;
      margin-top: 25px;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>Class Attendance Test</h1>


  <div id="usernameSection">

    <h2>Enter Your Username</h2>

    <input
      type="text"
      id="username"
      placeholder="NEIU username"
      autocapitalize="none"
    >

    <br>

    <button id="continueButton">
      Continue to Scanner
    </button>

  </div>


  <div id="scannerSection">

    <h2>Scan Today's QR Code</h2>

    <div id="reader"></div>

    <div id="result">
      Waiting for QR code...
    </div>

  </div>

</div>


<script>

  let scannerStarted = false;


  document
    .getElementById("continueButton")
    .addEventListener(
      "click",
      function() {

        const username =
          document
            .getElementById("username")
            .value
            .trim();

        if (!username) {

          alert(
            "Please enter your username."
          );

          return;
        }


        document
          .getElementById("usernameSection")
          .style.display = "none";


        document
          .getElementById("scannerSection")
          .style.display = "block";


        if (!scannerStarted) {

          scannerStarted = true;

          startScanner();
        }
      }
    );


  function startScanner() {

    function onScanSuccess(
      decodedText
    ) {

      document
        .getElementById("result")
        .innerText =
        "QR CODE READ: " +
        decodedText;
    }


    function onScanFailure(
      error
    ) {

      // Ignore normal failed scans.

    }


    const scanner =
      new Html5QrcodeScanner(

        "reader",

        {

          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          },

          rememberLastUsedCamera: true

        },

        false
      );


    scanner.render(
      onScanSuccess,
      onScanFailure
    );
  }

</script>


</body>

</html>
