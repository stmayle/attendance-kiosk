<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Class Attendance</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
      background: #f5f5f5;
    }

    .container {
      max-width: 550px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

    input {
      font-size: 20px;
      padding: 12px;
      width: 80%;
      max-width: 350px;
      text-align: center;
    }

    button {
      font-size: 20px;
      padding: 14px 28px;
      margin: 15px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #scannerSection {
      display: none;
    }

    #result {
      font-size: 24px;
      font-weight: bold;
      margin-top: 25px;
      white-space: pre-line;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>Class Attendance</h1>


  <div id="usernameSection">

    <h2>Enter Your Username</h2>

    <input
      type="text"
      id="username"
      placeholder="NEIU username"
      autocapitalize="none"
    >

    <br>

    <button id="continueButton">
      Continue to Scanner
    </button>

  </div>


  <div id="scannerSection">

    <h2>Scan Today's QR Code</h2>

    <div id="reader"></div>

    <div id="result">
      Waiting for QR code...
    </div>

  </div>

</div>


<script>

  /*
    REPLACE ONLY THE TEXT BETWEEN THE QUOTES
    WITH YOUR APPS SCRIPT /exec URL
  */

  var SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzxD3rkJFQEoEH6XhJ2mZP2HQ8KFC2rFyuNb_eT38FM6TLjSzge5F0gn125LDf0xdDm/exec";


  var currentUsername = "";
  var scannerStarted = false;
  var submissionLocked = false;


  /*
    DEVICE ID

    The first time this browser visits the site,
    it receives a random identifier.

    The identifier is then stored in localStorage
    and reused for future attendance submissions.
  */

  function getDeviceId() {

    var deviceId =
      localStorage.getItem(
        "attendanceDeviceId"
      );


    if (!deviceId) {

      deviceId =
        "device-" +
        new Date().getTime() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2, 12);


      localStorage.setItem(
        "attendanceDeviceId",
        deviceId
      );
    }


    return deviceId;
  }


  document
    .getElementById("continueButton")
    .onclick = function() {

      var username =
        document
          .getElementById("username")
          .value
          .trim()
          .toLowerCase();


      if (username === "") {

        alert("Please enter your username.");

        return;
      }


      currentUsername = username;


      document
        .getElementById("usernameSection")
        .style.display = "none";


      document
        .getElementById("scannerSection")
        .style.display = "block";


      if (!scannerStarted) {

        scannerStarted = true;

        startScanner();
      }
    };


  function startScanner() {


    function onScanSuccess(decodedText) {


      if (submissionLocked) {
        return;
      }


      submissionLocked = true;


      document
        .getElementById("result")
        .innerText =
        "QR CODE READ: " +
        decodedText +
        "\nSubmitting attendance...";


      sendAttendance(
        currentUsername,
        decodedText
      );
    }


    function onScanFailure(error) {

      // Normal failed scans are ignored.

    }


    var scanner =
      new Html5QrcodeScanner(

        "reader",

        {

          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          },

          rememberLastUsedCamera: true

        },

        false
      );


    scanner.render(
      onScanSuccess,
      onScanFailure
    );
  }


  function sendAttendance(
    username,
    sessionId
  ) {


    var callbackName =
      "attendanceCallback" +
      new Date().getTime();


    var deviceId =
      getDeviceId();


    window[callbackName] =
      function(result) {


        if (result.success) {

          document
            .getElementById("result")
            .innerText =
            "Attendance Recorded\n" +
            result.firstName +
            " " +
            result.lastName +
            "\n" +
            result.section;

        } else {

          document
            .getElementById("result")
            .innerText =
            "Attendance not recorded\n" +
            result.status;
        }


        submissionLocked = false;

        delete window[callbackName];

        document.body.removeChild(
          requestScript
        );
      };


    var requestScript =
      document.createElement("script");


    requestScript.src =
      SCRIPT_URL +
      "?username=" +
      encodeURIComponent(username) +
      "&sessionId=" +
      encodeURIComponent(sessionId) +
      "&deviceId=" +
      encodeURIComponent(deviceId) +
      "&callback=" +
      encodeURIComponent(callbackName);


    requestScript.onerror =
      function() {

        document
          .getElementById("result")
          .innerText =
          "Could not contact attendance server.";

        submissionLocked = false;
      };


    document.body.appendChild(
      requestScript
    );
  }

</script>


</body>

</html>
