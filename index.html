<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Class Attendance</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
      background: #f5f5f5;
    }

    .container {
      max-width: 550px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

    input {
      font-size: 20px;
      padding: 12px;
      width: 80%;
      max-width: 350px;
      text-align: center;
    }

    button {
      font-size: 20px;
      padding: 14px 28px;
      margin: 15px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #scannerSection {
      display: none;
    }

    #result {
      font-size: 24px;
      font-weight: bold;
      margin-top: 25px;
      white-space: pre-line;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>Class Attendance</h1>


  <div id="usernameSection">

    <h2>Enter Your Username</h2>

    <input
      type="text"
      id="username"
      placeholder="NEIU username"
      autocapitalize="none"
      autocomplete="username"
    >

    <br>

    <button id="continueButton">
      Continue to Scanner
    </button>

  </div>


  <div id="scannerSection">

    <h2>Scan Today's QR Code</h2>

    <div id="reader"></div>

    <div id="result">
      Waiting for QR code...
    </div>

  </div>

</div>


<script>

  // ==================================================
  // APPS SCRIPT WEB APP URL
  // ==================================================

  const SCRIPT_URL =
    https://script.google.com/macros/s/AKfycbx0vez2vcT7vBRxCWDIU6wOBnFyY9vSE5xjOhZMyRlvthfDKGOTBfzoAN7rWIewN4MQ/exec


  // ==================================================
  // DEVICE ID
  // ==================================================

  function getDeviceId() {

    let deviceId =
      localStorage.getItem(
        "attendanceDeviceId"
      );

    if (!deviceId) {

      if (
        window.crypto &&
        crypto.randomUUID
      ) {

        deviceId =
          "device-" +
          crypto.randomUUID();

      } else {

        deviceId =
          "device-" +
          Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .substring(2, 12);
      }

      localStorage.setItem(
        "attendanceDeviceId",
        deviceId
      );
    }

    return deviceId;
  }


  // ==================================================
  // USERNAME
  // ==================================================

  let currentUsername = "";

  const savedUsername =
    localStorage.getItem(
      "attendanceUsername"
    );

  if (savedUsername) {

    document
      .getElementById("username")
      .value =
      savedUsername;
  }


  // ==================================================
  // CONTINUE BUTTON
  // ==================================================

  let scannerStarted = false;


  document
    .getElementById("continueButton")
    .addEventListener(
      "click",
      function() {

        const username =
          document
            .getElementById("username")
            .value
            .trim()
            .toLowerCase();

        if (!username) {

          alert(
            "Please enter your username."
          );

          return;
        }


        currentUsername =
          username;


        localStorage.setItem(
          "attendanceUsername",
          username
        );


        document
          .getElementById("usernameSection")
          .style.display =
          "none";


        document
          .getElementById("scannerSection")
          .style.display =
          "block";


        if (!scannerStarted) {

          scannerStarted = true;

          startScanner();
        }
      }
    );


  // ==================================================
  // QR SCANNER
  // ==================================================

  let submissionLocked = false;


  function startScanner() {


    function onScanSuccess(
      decodedText
    ) {

      if (submissionLocked) {
        return;
      }


      submissionLocked =
        true;


      document
        .getElementById("result")
        .innerText =
        "QR CODE READ: " +
        decodedText +
        "\nSubmitting attendance...";


      submitAttendance(
        currentUsername,
        decodedText.trim()
      );
    }


    function onScanFailure(
      error
    ) {

      // Normal scan failures are ignored.

    }


    const scanner =
      new Html5QrcodeScanner(

        "reader",

        {

          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          },

          rememberLastUsedCamera:
            true

        },

        false
      );


    scanner.render(
      onScanSuccess,
      onScanFailure
    );
  }


  // ==================================================
  // SEND ATTENDANCE USING JSONP
  // ==================================================

  function submitAttendance(
    username,
    sessionId
  ) {


    const callbackName =
      "attendanceCallback_" +
      Date.now();


    const params =
      new URLSearchParams({

        username:
          username,

        sessionId:
          sessionId,

        deviceId:
          getDeviceId(),

        userAgent:
          navigator.userAgent,

        callback:
          callbackName
      });


    const script =
      document.createElement(
        "script"
      );


    window[callbackName] =
      function(result) {


        const resultBox =
          document
            .getElementById("result");


        if (result.success) {

          resultBox.innerText =
            "✓ Attendance Recorded\n" +
            result.firstName +
            " " +
            result.lastName +
            "\n" +
            result.section;

        } else {

          resultBox.innerText =
            "✗ " +
            result.status;
        }


        delete window[
          callbackName
        ];

        script.remove();


        setTimeout(
          function() {

            submissionLocked =
              false;

          },

          4000
        );
      };


    script.onerror =
      function() {


        document
          .getElementById("result")
          .innerText =
          "Unable to contact attendance server.";


        submissionLocked =
          false;


        delete window[
          callbackName
        ];

        script.remove();
      };


    script.src =
      SCRIPT_URL +
      "?" +
      params.toString();


    document.body
      .appendChild(
        script
      );
  }

</script>


</body>

</html>
