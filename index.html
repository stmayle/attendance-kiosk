<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Class Attendance</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
      background: #f5f5f5;
    }

    .container {
      max-width: 550px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

    input {
      font-size: 20px;
      padding: 12px;
      width: 80%;
      max-width: 350px;
      text-align: center;
    }

    button {
      font-size: 20px;
      padding: 14px 28px;
      margin: 15px;
    }

    #forgetButton {
      font-size: 14px;
      padding: 8px 14px;
      margin-top: 5px;
      display: none;
    }

    #savedMessage {
      font-size: 14px;
      color: #666;
      margin-top: 8px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #scannerSection {
      display: none;
    }

    #result {
      font-size: 24px;
      font-weight: bold;
      margin-top: 25px;
      white-space: pre-line;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>Class Attendance</h1>


  <div id="usernameSection">

    <h2>Enter Your Username</h2>

    <input
      type="text"
      id="username"
      placeholder="NEIU username"
      autocapitalize="none"
      autocomplete="username"
    >

    <div id="savedMessage"></div>

    <br>

    <button id="continueButton">
      Continue to Scanner
    </button>

    <br>

    <button
      id="forgetButton"
      onclick="forgetUsername()"
    >
      Forget Saved Username
    </button>

  </div>


  <div id="scannerSection">

    <h2>Scan Today's QR Code</h2>

    <div id="reader"></div>

    <div id="result">
      Waiting for QR code...
    </div>

  </div>

</div>


<script>

  /*
    GOOGLE APPS SCRIPT WEB APP URL
  */

  var SCRIPT_URL =
    "PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE";


  var currentUsername = "";

  var scannerStarted = false;

  var submissionLocked = false;

  var qrScanner = null;



  /*
    DEVICE ID
  */

  function getDeviceId() {

    var deviceId =
      localStorage.getItem(
        "attendanceDeviceId"
      );


    if (!deviceId) {

      deviceId =
        "device-" +
        new Date().getTime() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2, 12);


      localStorage.setItem(
        "attendanceDeviceId",
        deviceId
      );
    }


    return deviceId;
  }



  /*
    SAVED USERNAME
  */

  function loadSavedUsername() {

    var savedUsername =
      localStorage.getItem(
        "attendanceUsername"
      );


    if (savedUsername) {

      document
        .getElementById("username")
        .value =
        savedUsername;


      document
        .getElementById("savedMessage")
        .innerText =
        "Saved username: " +
        savedUsername;


      document
        .getElementById("forgetButton")
        .style.display =
        "inline-block";
    }
  }



  function saveUsername(
    username
  ) {

    localStorage.setItem(
      "attendanceUsername",
      username
    );
  }



  function forgetUsername() {

    localStorage.removeItem(
      "attendanceUsername"
    );


    document
      .getElementById("username")
      .value =
      "";


    document
      .getElementById("savedMessage")
      .innerText =
      "";


    document
      .getElementById("forgetButton")
      .style.display =
      "none";
  }



  /*
    CONTINUE BUTTON
  */

  document
    .getElementById("continueButton")
    .onclick = function() {


      var username =
        document
          .getElementById("username")
          .value
          .trim()
          .toLowerCase();


      if (username === "") {

        alert(
          "Please enter your username."
        );

        return;
      }


      currentUsername =
        username;


      /*
        Remember the username
        on this browser/device.
      */

      saveUsername(
        username
      );


      document
        .getElementById("usernameSection")
        .style.display =
        "none";


      document
        .getElementById("scannerSection")
        .style.display =
        "block";


      if (!scannerStarted) {

        scannerStarted = true;

        startScanner();
      }
    };



  /*
    START QR SCANNER
  */

  function startScanner() {


    function onScanSuccess(
      decodedText
    ) {


      if (submissionLocked) {

        return;
      }


      submissionLocked =
        true;


      /*
        QR successfully decoded.
        Shut camera off immediately.
      */

      stopScanner();


      document
        .getElementById("result")
        .innerText =
        "QR code read.\nSubmitting attendance...";


      sendAttendance(
        currentUsername,
        decodedText
      );
    }



    function onScanFailure(
      error
    ) {

      /*
        Normal scanning failures
        are ignored.
      */

    }



    qrScanner =
      new Html5QrcodeScanner(

        "reader",

        {

          fps: 10,

          qrbox: {

            width: 250,

            height: 250

          },

          rememberLastUsedCamera:
            true

        },

        false
      );


    qrScanner.render(
      onScanSuccess,
      onScanFailure
    );
  }



  /*
    STOP CAMERA
  */

  function stopScanner() {


    if (qrScanner) {


      qrScanner
        .clear()
        .then(function() {

          qrScanner = null;

        })
        .catch(function(error) {

          console.log(
            "Scanner cleanup:",
            error
          );

        });

    }
  }



  /*
    SEND ATTENDANCE TO APPS SCRIPT
  */

  function sendAttendance(
    username,
    sessionId
  ) {


    var callbackName =
      "attendanceCallback" +
      new Date().getTime();


    var deviceId =
      getDeviceId();



    window[callbackName] =
      function(result) {


        if (result.success) {


          if (
            result.action === "IN"
          ) {


            document
              .getElementById("result")
              .innerText =
              "✓ Checked IN\n\n" +
              result.firstName +
              " " +
              result.lastName +
              "\n" +
              result.section;


          } else if (
            result.action === "OUT"
          ) {


            document
              .getElementById("result")
              .innerText =
              "✓ Checked OUT\n\n" +
              result.firstName +
              " " +
              result.lastName +
              "\n" +
              result.section;


          } else {


            document
              .getElementById("result")
              .innerText =
              "✓ Attendance Recorded\n\n" +
              result.firstName +
              " " +
              result.lastName +
              "\n" +
              result.section;

          }

        }


        else {


          document
            .getElementById("result")
            .innerText =
            "Attendance not recorded\n\n" +
            result.status;

        }



        delete window[
          callbackName
        ];


        document.body.removeChild(
          requestScript
        );

      };



    var requestScript =
      document.createElement(
        "script"
      );


    requestScript.src =
      SCRIPT_URL +
      "?username=" +
      encodeURIComponent(username) +
      "&sessionId=" +
      encodeURIComponent(sessionId) +
      "&deviceId=" +
      encodeURIComponent(deviceId) +
      "&callback=" +
      encodeURIComponent(callbackName);



    requestScript.onerror =
      function() {


        document
          .getElementById("result")
          .innerText =
          "Could not contact attendance server.";

      };


    document.body.appendChild(
      requestScript
    );
  }



  /*
    PAGE STARTUP
  */

  loadSavedUsername();

</script>


</body>

</html>
