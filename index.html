<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Class Attendance</title>


  <script
    src="https://unpkg.com/html5-qrcode">
  </script>


  <style>

    body {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      margin: 0;

      padding: 20px;

      background: #f3f3f3;

      text-align: center;
    }


    .container {

      max-width: 600px;

      margin: 0 auto;

      padding: 30px;

      background: white;

      border-radius: 12px;
    }


    h1 {

      margin-top: 0;
    }


    input {

      width: 85%;

      max-width: 350px;

      padding: 14px;

      font-size: 20px;

      text-align: center;

      box-sizing: border-box;
    }


    button {

      padding: 14px 28px;

      margin: 15px;

      font-size: 20px;

      cursor: pointer;
    }


    #scannerSection {

      display: none;

      margin-top: 25px;
    }


    #reader {

      width: 100%;

      max-width: 500px;

      margin: 20px auto;
    }


    #message {

      margin-top: 25px;

      font-size: 24px;

      font-weight: bold;

      white-space: pre-line;
    }


    .instructions {

      color: #666;

      font-size: 14px;
    }

  </style>

</head>



<body>


<div class="container">


  <h1>
    Class Attendance
  </h1>


  <div id="loginSection">

    <h2>
      Enter Your Username
    </h2>


    <input
      id="username"
      type="text"
      placeholder="NEIU username"
      autocapitalize="none"
      autocomplete="username"
    >


    <p class="instructions">
      Your username will be remembered
      on this device.
    </p>


    <button
      onclick="continueToScanner()"
    >
      Continue
    </button>

  </div>



  <div id="scannerSection">

    <h2>
      Scan Today's Class QR Code
    </h2>


    <div id="reader"></div>


    <div id="message">
      Camera ready.
    </div>

  </div>


</div>



<script>


  // ==================================================
  // YOUR GOOGLE APPS SCRIPT URL
  // ==================================================

  const SCRIPT_URL =
    "PASTE_YOUR_APPS_SCRIPT_URL_HERE";



  // ==================================================
  // DEVICE ID
  // ==================================================

  function getDeviceId() {


    let deviceId =
      localStorage.getItem(
        "attendanceDeviceId"
      );


    if (!deviceId) {


      if (
        window.crypto &&
        crypto.randomUUID
      ) {

        deviceId =
          "device-" +
          crypto.randomUUID();

      } else {

        deviceId =
          "device-" +
          Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .substring(2, 12);
      }


      localStorage.setItem(
        "attendanceDeviceId",
        deviceId
      );
    }


    return deviceId;
  }



  // ==================================================
  // LOAD SAVED USERNAME
  // ==================================================

  function loadUsername() {


    const saved =
      localStorage.getItem(
        "attendanceUsername"
      );


    if (saved) {

      document
        .getElementById("username")
        .value = saved;
    }
  }



  // ==================================================
  // START SCANNER
  // ==================================================

  let scanner = null;

  let submissionLocked = false;



  function continueToScanner() {


    const username =
      document
        .getElementById("username")
        .value
        .trim()
        .toLowerCase();


    if (!username) {

      alert(
        "Please enter your username."
      );

      return;
    }


    localStorage.setItem(
      "attendanceUsername",
      username
    );


    document
      .getElementById("loginSection")
      .style.display = "none";


    document
      .getElementById("scannerSection")
      .style.display = "block";


    startScanner();
  }



  function startScanner() {


    if (scanner) {
      return;
    }


    scanner =
      new Html5QrcodeScanner(

        "reader",

        {

          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          },

          rememberLastUsedCamera: true,

          supportedScanTypes: [
            Html5QrcodeScanType
              .SCAN_TYPE_CAMERA
          ]
        },

        false
      );


    scanner.render(
      onScanSuccess,
      onScanFailure
    );
  }



  function onScanFailure(error) {

    // Normal failed scan attempts
    // are ignored.

  }



  // ==================================================
  // QR CODE SUCCESS
  // ==================================================

  function onScanSuccess(decodedText) {


    if (submissionLocked) {
      return;
    }


    submissionLocked = true;


    document
      .getElementById("message")
      .innerText =
      "Submitting attendance...";


    const username =
      localStorage.getItem(
        "attendanceUsername"
      );


    submitAttendance(
      username,
      decodedText.trim()
    );
  }



  // ==================================================
  // JSONP SUBMISSION
  // ==================================================

  function submitAttendance(
    username,
    sessionId
  ) {


    const callbackName =
      "attendanceCallback_" +
      Date.now();


    const params =
      new URLSearchParams({

        username: username,

        sessionId: sessionId,

        deviceId:
          getDeviceId(),

        userAgent:
          navigator.userAgent,

        callback:
          callbackName
      });



    window[callbackName] =
      function(result) {


        const message =
          document
            .getElementById("message");


        if (result.success) {


          message.innerText =
            "✓ Attendance Recorded\n\n" +
            result.firstName +
            " " +
            result.lastName +
            "\n" +
            result.section;


          // Stop scanning after
          // successful attendance.

          if (scanner) {

            scanner.clear()
              .catch(function() {});
          }


        } else {


          message.innerText =
            "✗ " +
            result.status;


          // Allow another scan after
          // an unsuccessful submission.

          setTimeout(
            function() {

              submissionLocked = false;

            },

            3000
          );
        }


        delete window[callbackName];

        script.remove();
      };



    const script =
      document.createElement(
        "script"
      );


    script.src =
      SCRIPT_URL +
      "?" +
      params.toString();


    script.onerror =
      function() {


        document
          .getElementById("message")
          .innerText =
          "Unable to contact attendance server.";


        submissionLocked = false;


        delete window[callbackName];

        script.remove();
      };


    document.body.appendChild(
      script
    );
  }



  // ==================================================
  // INITIALIZE PAGE
  // ==================================================

  loadUsername();


</script>


</body>

</html>
