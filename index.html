
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Attendance QR Test</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #result {
      font-size: 28px;
      font-weight: bold;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <h1>Attendance QR Test</h1>

  <p>Scan a QR code to test the camera.</p>

  <div id="reader"></div>

  <div id="result">
    Waiting for QR code...
  </div>


  <script>

    function onScanSuccess(decodedText) {

      document.getElementById("result").innerText =
        "QR CODE READ: " + decodedText;

    }


    function onScanFailure(error) {
      // Ignore normal scanning failures.
      // The scanner continuously looks for a QR code.
    }


    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        rememberLastUsedCamera: true
      },

      false
    );


    scanner.render(
      onScanSuccess,
      onScanFailure
    );

  </script>

</body>
</html>
